<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Student Management System{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Student Management System</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            |
            <a href="{% url 'add_student' %}">Add Student</a>
            |
            <a href="{% url 'view_student' %}">View Student</a>
        </nav>
    </header>
    <hr>

    <!-- Django Messages -->
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</body>
</html>
