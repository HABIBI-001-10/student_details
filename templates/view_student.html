<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Student</title>
</head>

<body>

    <h1>Find Student</h1>

    <form method="post">

        {% csrf_token %}

        <label for="email">Email:</label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <button type="submit">
            Find Student
        </button>

    </form>


    {% if student %}

        <p>
            <strong>ID:</strong>
            {{ student.id }}
        </p>

        <p>
            <strong>Name:</strong>
            {{ student.name }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ student.email }}
        </p>

        <p>
            <strong>Date of Birth:</strong>
            {{ student.date_of_birth }}
        </p>

        <p>
            <strong>Department:</strong>
            {{ student.department }}
        </p>


        <!-- Update -->

        <a href="{% url 'update_student' student.id %}">
            Update Student
        </a>


        <!-- Delete -->

        <form
            method="post"
            action="{% url 'delete_student' student.id %}"
        >

            {% csrf_token %}

            <button type="submit">
                Delete Student
            </button>

        </form>


    {% else %}

        <p>Student not found.</p>

    {% endif %}

</body>

</html>
