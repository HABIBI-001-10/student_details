
{% extends 'base.html' %}
{% block title %}Update Student{% endblock %}
{% block content %}
<h1>Update Student</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Update Student
    </button>

    <a href="{% url 'view_student_by_email' student.email %}">
        Cancel
    </a>

</form>
{% endblock %}
